<div class="store-container" *ngIf="!isMobile || !selectedProduct">
 <!-- <h1>Trgovina</h1>-->
  <app-product-card
    *ngFor="let product of products"
    [title]="product.title | translate"
    [shortDesc]="product.shortDesc | translate"
    [price]="product.price"
    [onDiscount]="product.onDiscount"
    [discountPrice]="product.discountPrice"
    [discountPercentage]="product.discountPercentage"
    [imageUrl]="product.imgUrl"
    (click)="openModal(product)"
  ></app-product-card>
</div>


<!-- MODAL -->
<div class="modal-container" *ngIf="selectedProduct">
  <button class="close-btn-mobile"  *ngIf="isMobile" (click)="closeModal()">×</button> <!-- ZDAJ JE TUKAJ -->
  <div class="modal-backdrop"  *ngIf="!isMobile" (click)="closeModal()"></div>
  <div [ngClass]="isMobile ? 'modal-body-mobile' : 'modal-body'" *ngIf="selectedProduct">
    <div class="modal-gallery" *ngIf="selectedProduct">
      <swiper-container
        navigation="true"
        pagination="true"
        loop="true"
        style="width: 100%; height: 100%;"
      >
        <swiper-slide *ngFor="let media of selectedProduct.gallery">
          <img
            *ngIf="media.type === 'image'"
            [src]="media.src"
            alt="Product image"
            style="width: 100%; border-radius: 8px;"
          />
          <video
            *ngIf="media.type === 'video'"
            [src]="media.src"
            controls
            preload="metadata"
            style="width: 100%; border-radius: 8px;"
          ></video>
        </swiper-slide>
      </swiper-container>

    </div>

    <div class="modal-content">
      <h2>{{ selectedProduct.title | translate }}</h2>
      <div class="long-desc">
        <ng-container *ngIf="selectedProduct.isDescArray; else stringDesc">
          <ng-container *ngFor="let textPart of selectedProduct.longDescArray">
            <span>
              <ng-container *ngIf="textPart.isBold; else normalText">
                <strong>{{ textPart.text | translate }}</strong>
              </ng-container>
              <ng-template #normalText>{{ textPart.text | translate }}</ng-template>

                          <!-- Dodaj presledek ali prelom -->
              <ng-container *ngIf="textPart.newLine; else space">
                <br><br>
              </ng-container>
              <ng-template #space>&nbsp;</ng-template>
            </span>
          </ng-container>
        </ng-container>

        <ng-template #stringDesc>
          <p *ngFor="let paragraph of selectedProduct.longDesc.split('\n\n')">
            {{ paragraph }}
          </p>
        </ng-template>
      </div>

      <!--      <div class="long-desc">
              <p *ngFor="let paragraph of selectedProduct.longDesc.split('\n\n')">
                {{ paragraph }}
              </p>
            </div>-->
  <!--    <div class="modal-bottom">
        <strong>{{ selectedProduct.price }} €</strong>
        <button class="buy-btn" onclick="window.location.href='https://buy.stripe.com/8wM5kCem0dhT70QfZ0'">Kupi</button>
      </div>-->
      <div class="modal-bottom">
        <ng-container *ngIf="selectedProduct.onDiscount; else regularPrice">
          <div class="discount-line">
            <span class="original-price">{{ selectedProduct.price }} €</span>
            <span class="discount-price">{{ selectedProduct.discountPrice }} €</span>
            <span class="discount-percent"> -{{ selectedProduct.discountPercentage }}%</span>
          </div>
        </ng-container>
        <ng-template #regularPrice>
          <span class="price">{{ selectedProduct.price }} €</span>
        </ng-template>

<!--
        <button class="buy-btn" onclick="window.location.href='https://buy.stripe.com/8wM5kCem0dhT70QfZ0'">Kupi</button>
-->
<!--
        <button class="buy-btn" onclick="window.location.href='https://buy.stripe.com/cN25kCdhW1zb70Q003'">Kupi</button>
-->
        <button class="buy-btn" (click)="goToStripeLink()">{{ 'store.buy' | translate }}</button>
      </div>

    </div>

    <button *ngIf="!isMobile" class="close-btn" (click)="closeModal()">×</button>
  </div>

</div>
