<div class="tickets-wrapper">
  <div class="tickets-container">
    <app-ticket-card
      *ngFor="let ticket of tickets"
      [title]="ticket.title"
      [shortDesc]="ticket.shortDesc"
      [date]="ticket.date"
      [time]="ticket.time"
      [price]="ticket.price"
      [imgUrl]="ticket.imgUrl"
    ></app-ticket-card>
  </div>
</div>
